name: MTF console integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  console-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/console-data-integrity.cjs
