name: MTF console integrity
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'paper/**'
jobs:
  console-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
