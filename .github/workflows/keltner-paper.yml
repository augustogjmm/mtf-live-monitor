name: Keltner H4 forward paper
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keltner-paper.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: keltner-forward-paper
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect observed quotes without historical fills
        run: node scripts/collect-keltner-paper.cjs
      - name: Persist complete paper snapshot
        env:
          PAPER_AUTHOR: ${{ github.repository_owner }}
          PAPER_AUTHOR_ID: ${{ github.repository_owner_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/keltner-h4.json
          if git diff --cached --quiet; then exit 0; fi
          git commit --author="$PAPER_AUTHOR <$PAPER_AUTHOR_ID+$PAPER_AUTHOR@users.noreply.github.com>" -m 'Update Keltner forward paper observations (automated)'
          # Rebase only this data commit if an application change landed meanwhile.
          git pull --rebase origin main
          git push origin HEAD:main
