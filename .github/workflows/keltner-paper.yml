name: Keltner H4 forward paper
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: keltner-forward-paper
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect observed quotes without historical fills
        run: node scripts/collect-keltner-paper.cjs
      - name: Persist complete paper snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/keltner-h4.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Keltner forward paper observations'
          # Rebase only this data commit if an application change landed meanwhile.
          git pull --rebase origin main
          git push origin HEAD:main
