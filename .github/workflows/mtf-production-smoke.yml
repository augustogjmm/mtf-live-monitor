name: MTF production read-only check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/validate-deployment.cjs artifacts/production-check.json
      - uses: actions/upload-artifact@v7
        with:
          name: production-check
          path: artifacts/production-check.json
          retention-days: 14
